services:
  - type: web
    name: gp-connect-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    # Add your environment variables in Render dashboard:
    # - MONGODB_URI
    # - JWT_SECRET
    # - CLOUDINARY_CLOUD_NAME
    # - CLOUDINARY_API_KEY
    # - CLOUDINARY_API_SECRET
    # - GENERAL_COMMUNITY_ID
    # - CHAT_SECRET