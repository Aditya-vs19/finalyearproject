services:
  - type: web
    name: gp-connect-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
    # Add your environment variables in Render dashboard:
    # - MONGODB_URI (or MONGO_URI)
    # - JWT_SECRET
    # - CLOUDINARY_CLOUD_NAME
    # - CLOUDINARY_API_KEY
    # - CLOUDINARY_API_SECRET
    # - CHAT_SECRET
    # - EMAIL_USER
    # - EMAIL_PASS
    # - CORS_ORIGIN